<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BCC Marks Schedule</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--fg:#0f172a;--muted:#64748b;--border:#e2e8f0;--primary:#0f172a;--accent:#f1f5f9;--danger:#dc2626;--ok:#15803d;--navy:#1e3a5f;--gold:#C9A24B}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);font-size:14px}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
.layout{display:flex;min-height:100vh}
.side{width:240px;background:#fff;border-right:1px solid var(--border);padding:12px 10px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;gap:8px;align-items:center;font-weight:700;padding:6px 8px 14px}
.brand svg{width:24px;height:24px}
.navlbl{font-size:11px;color:var(--muted);padding:10px 8px 4px}
.nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--fg);text-decoration:none;margin-bottom:2px}
.nav a:hover{background:var(--accent)}
.nav a.on{background:var(--accent);font-weight:600}
.pbox{margin:6px 4px 4px;padding:10px;border:1px solid var(--border);border-radius:10px;background:#f8fafc}
.pbox .n{font-weight:700;font-size:13px;line-height:1.3}
.main{flex:1;min-width:0}
.page{padding:24px;max-width:1200px;margin:0 auto}
.page.narrow{max-width:820px}
h1{font-size:24px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.card h3{margin:0 0 14px;font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;background:var(--primary);color:#fff;padding:8px 14px;border-radius:8px;font-weight:500;font-size:14px}
.btn:hover{opacity:.9}
.btn.out{background:#fff;color:var(--fg);border-color:var(--border)}
.btn.out:hover{background:var(--accent)}
.btn.ghost{background:transparent;color:var(--fg)}
.btn.ghost:hover{background:var(--accent)}
.btn.sec{background:var(--accent);color:var(--fg)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.lg{padding:10px 18px;font-size:15px}
.btn.danger{background:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.l{display:block;font-weight:500;margin-bottom:6px;font-size:13px}
.inp{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:#fff}
.inp:focus{outline:2px solid #94a3b8;outline-offset:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.tile{border:2px solid var(--border);background:#fff;border-radius:16px;padding:22px;text-align:left;transition:.15s}
.tile:hover{border-color:var(--primary);box-shadow:0 4px 14px rgba(0,0,0,.06)}
.tile .big{font-size:24px;font-weight:700}
.tile .small{font-size:12px;color:var(--muted);margin-top:4px}
.pcard{border:1px solid var(--border);background:#fff;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px}
.pcard.on{border:2px solid var(--primary)}
.pcard .nm{font-size:17px;font-weight:700;line-height:1.25}
.empty{padding:48px;text-align:center;color:var(--muted)}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{background:var(--accent);position:sticky;top:0;padding:8px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);text-align:left;z-index:1}
table.dt td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:0}
table.dt td.c{text-align:center;padding:6px;background:#f8fafc}
table.dt td.p{padding:6px 8px}
table.dt input{width:100%;border:0;padding:6px 8px;background:transparent;outline:none}
table.dt input:focus{background:#e0f2fe}
.scroll{overflow:auto;border:1px solid var(--border);border-radius:8px;max-height:62vh}
.hint{font-size:12px;color:var(--muted)}
.err{color:var(--danger);font-size:13px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:12px;padding:22px;width:100%;max-width:880px;max-height:92vh;display:flex;flex-direction:column;gap:14px;overflow:auto}
.modal.smm{max-width:460px}.modal.md{max-width:620px}
.modal h2{margin:0;font-size:18px}
.foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#toast{position:fixed;bottom:20px;right:20px;z-index:99;display:flex;flex-direction:column;gap:8px}
.t{background:#fff;border:1px solid var(--border);box-shadow:0 6px 20px rgba(0,0,0,.12);border-radius:10px;padding:10px 14px;min-width:220px}
.t.err{border-left:4px solid var(--danger);color:var(--fg)}.t.ok{border-left:4px solid var(--ok)}
.stat{border:1px solid var(--border);border-radius:12px;background:#fff;padding:14px}
.stat .k{font-size:12px;color:var(--muted)}.stat .v{font-size:22px;font-weight:700;margin-top:4px}
.badge{display:inline-block;background:var(--accent);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600}
.badge.dark{background:var(--primary);color:#fff}
.subj{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.subj .ix{width:26px;text-align:right;color:var(--muted);font-size:12px}
.subj .hd{cursor:grab;user-select:none;font-size:16px;color:var(--muted);width:22px;text-align:center}
.subj.drag{opacity:.4}.subj.over{box-shadow:0 -3px 0 #0f172a}
.ordname{flex:1;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:#f8fafc}
.subj input{flex:1}
.x{border:1px solid var(--border);background:#fff;border-radius:8px;width:34px;height:36px}
.x:hover{background:#fee2e2}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;max-height:200px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:10px}
.checks label{display:flex;gap:6px;align-items:center;font-size:13px}
.hamb{display:none}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f1f5f9;padding:16px}
.login .card{width:100%;max-width:380px;padding:28px}
@media (max-width:820px){.side{position:fixed;left:-250px;z-index:40;transition:.2s}.side.open{left:0}.hamb{display:inline-flex;margin:10px}}

/* ================= A3 MARKS SCHEDULE (print-ready, black only) ================= */
.a3{width:392mm;height:283mm;background:#fff;color:#000;overflow:hidden;position:relative;
  font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.a3-in{width:100%;height:100%;display:flex;flex-direction:column;transform-origin:top left}
.a3 .hdr{display:grid;grid-template-columns:34mm 1fr 70mm;align-items:center;gap:4mm;padding-bottom:1.6mm;border-bottom:2.4pt double #000;margin-bottom:2.2mm;height:31mm;flex:none}
.a3 .lg{height:26mm;display:flex;align-items:center;justify-content:center}
.a3 .lg img{max-height:26mm;max-width:32mm;object-fit:contain}
.a3 .ctr{text-align:center;line-height:1.12}
.a3 .k1{font-size:11pt;font-weight:700;letter-spacing:4pt}
.a3 .k2{font-family:Cambria,Caladea,"Times New Roman",serif;font-size:22pt;font-weight:700;text-transform:uppercase;margin:.6mm 0 .8mm;letter-spacing:.3pt}
.a3 .k3{font-size:11.5pt;font-weight:700;text-transform:uppercase;letter-spacing:1.5pt}
.a3 .k4{font-size:11pt;font-weight:600;margin-top:.4mm}
.a3 .info{border-collapse:collapse;width:100%;font-size:8.8pt;border:1pt solid #000}
.a3 .info th{text-align:left;font-weight:700;padding:.7mm 1.6mm;border:.5pt solid #000;width:27mm}
.a3 .info td{padding:.7mm 1.6mm;border:.5pt solid #000;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40mm}
.a3 .bd{display:flex;gap:3mm;flex:none;align-items:flex-start}
.a3 table.mt{border-collapse:collapse;table-layout:fixed;border:1.2pt solid #000;font-size:7.6pt}
.a3 .mt th,.a3 .mt td{border:.5pt solid #000;padding:0 .6mm;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a3 .mt thead th{font-weight:700;font-size:8pt;border-bottom:1.2pt solid #000;vertical-align:middle}
.a3 .mt th.v div{writing-mode:vertical-rl;transform:rotate(180deg);margin:0 auto;white-space:normal;max-height:23mm;line-height:1.05;text-align:left}
.a3 .mt td.nm{text-align:left;padding-left:1.2mm}
.a3 .mt td.b{font-weight:700}
.a3 .mt .gl{border-left:1.2pt solid #000}
.a3 .mt tbody tr.f5 td{border-bottom:1pt solid #000}
.a3 .sd{display:flex;flex-direction:column;gap:2.4mm;flex:none}
.a3 table.st{border-collapse:collapse;table-layout:fixed;width:100%;font-size:7.4pt;border:1.2pt solid #000}
.a3 .st th,.a3 .st td{border:.5pt solid #000;padding:0 .9mm;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a3 .st th{font-weight:700}
.a3 .st th.tt{font-size:8pt;letter-spacing:1.2pt;text-transform:uppercase;border-bottom:1.6pt double #000}
.a3 .st td.l{text-align:left}
.a3 .key{font-size:7.4pt;border:1pt solid #000;padding:1.2mm 1.6mm;line-height:1.45}
.a3 .ft{display:grid;grid-template-columns:repeat(3,1fr);gap:16mm;padding:0 8mm;margin-top:auto;flex:none;height:13mm;align-items:end}
.a3 .ft div{text-align:center;font-size:8.6pt;font-weight:700}
.a3 .ft .ln{border-top:.8pt dotted #000;padding-top:1mm}
.a3 .ft .nmx{font-weight:500;font-size:8pt;margin-top:.4mm;min-height:3mm}
.a3wrap{overflow:auto;border:1px solid var(--border);border-radius:8px;background:#e5e7eb;padding:14px}
.a3wrap .a3{box-shadow:0 2px 12px rgba(0,0,0,.18);margin:0 auto 14px}

/* ================= Slides ================= */
.deck{position:fixed;inset:0;background:#171717;z-index:45;display:flex;flex-direction:column}
.deck .bar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#262626;color:#fff}
.deck .stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.deck .thumbs{background:#262626;padding:8px;display:flex;gap:6px;overflow-x:auto}
.deck .thumbs button{background:#404040;color:#fff;border:0;border-radius:4px;padding:6px 12px}
.deck .thumbs button.on{background:#fff;color:#111}
.arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:20px}
.slide{width:1280px;height:720px;background:#fff;color:#111;display:flex;flex-direction:column;font-family:Georgia,"Times New Roman",serif;flex-shrink:0}
.slide .sh{background:var(--navy);color:#fff;padding:16px 28px;font-size:24px;font-weight:700;border-bottom:5px solid var(--gold)}
.slide .sb{flex:1;padding:22px 28px;min-height:0;overflow:hidden;font-family:system-ui,sans-serif}
.slide table{border-collapse:collapse;width:100%}
.slide th{background:var(--navy);color:#fff}
.slide th,.slide td{border:1px solid #444;padding:4px 6px;text-align:center}
.panel{border:2px solid var(--navy);border-radius:8px;padding:10px;background:#fff}
.kpi{border-radius:10px;color:#fff;padding:16px}
.kpi .k{font-size:14px;opacity:.85}.kpi .v{font-size:40px;font-weight:700}
#printroot{display:none}

@page{size:A3 landscape;margin:0.25in 0.25in 0.25in 0.8in}
@page deck{size:A3 landscape;margin:0}
@media print{
  body{background:#fff}
  body.printing .layout,body.printing #toast,body.printing #modal,body.printing .login{display:none!important}
  body.printing #printroot{display:block}
  #printroot .a3{box-shadow:none;margin:0;break-after:page;page-break-after:always;break-inside:avoid;page-break-inside:avoid}
  #printroot .a3:last-child{break-after:auto;page-break-after:auto}
  #printroot .dpage{page:deck;width:420mm;height:297mm;overflow:hidden;break-after:page}
}
</style>

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="printroot"></div>

<script>
/* =====================================================================
   Student Marks Schedule System — single-file edition
   All data is saved in this browser (localStorage).
   ===================================================================== */
const LOGIN = {user:'bcc123', pass:'bcc123'};

// ---------- Constants ----------
const YEARS = ['2025','2026','2027','2028','2029','2030'];
const TERMS = ['1st','2nd','3rd','4th','5th'];
const SECTIONS = {'Primary':{from:1,to:5,label:'Primary (Grades 1 – 5)'},'Secondary':{from:6,to:9,label:'Secondary (Grades 6 – 9)'},'Senior Secondary':{from:10,to:11,label:'Senior Secondary (Grades 10 – 11)'},'A.L':{from:12,to:13,label:'A.L (Grades 12 – 13)'}};
const DEFDIV = {'Secondary':12,'Senior Secondary':9};   // existing method: ÷12 for Grades 6–9, ÷9 for Grades 10–11
const SUGGEST = {
  'Primary':['Religion','Tamil','Mathematics','English','Environment','Sinhala'],
  'Secondary':['Religion','Tamil Lang','Mathematics','English','Science','Geography','Sinhala','Civics','P.T.S','History','Health','Art','English Lit'],
  'Senior Secondary':['Religion','Tamil Lang','Mathematics','English','Science','History','Sinhala','Commerce','ICT','Geography','Civics','Health','Art','Home Econ','Designing','Tamil Lit','English Lit','Arab Lit'],
  'A.L':['General English','G.I.T']
};
const MAIN_SUBJ = ['Religion','Tamil','Tamil Lang','Mathematics','English','Science','History'];
const ROWS = 52;

// ---------- Grading (unchanged method) ----------
const gradeNo = n => { const m = String(n).match(/^(\d+)/); return m ? parseInt(m[1],10) : 0; };
const isMark = v => typeof v === 'number' && v >= 0;
const isAb = v => v === -1;
// Grade bands — customisable per section in each marksheet. GB/PASS hold the bands of the class being worked on.
const DEFAULT_BANDS=[{g:'A',min:75},{g:'B',min:65},{g:'C',min:50},{g:'S',min:35},{g:'W',min:0}];
const BAND_PRESETS={'Standard (A B C S W)':DEFAULT_BANDS,'With D (A B C S W D)':[{g:'A',min:75},{g:'B',min:65},{g:'C',min:50},{g:'S',min:35},{g:'W',min:20},{g:'D',min:0}]};
let GB=DEFAULT_BANDS, PASS=35;
const GL = () => GB.map(b=>b.g);
const zeroCounts = () => Object.fromEntries(GL().map(g=>[g,0]));
const grade = m => { if(m==null||isNaN(m)||m<0) return ''; const b=GB.find(x=>m>=x.min); return b?b.g:''; };
const bandRanges = (B=GB) => B.map((b,i)=>({g:b.g,min:b.min,max:i===0?100:B[i-1].min-1}));
const bandText = (B=GB,sep='  ') => bandRanges(B).map(r=>`${r.g} = ${r.min}–${r.max}`).join(sep);
const normBands = b => (b&&b.length?b:DEFAULT_BANDS).map(x=>({g:String(x.g).trim(),min:+x.min})).sort((a,c)=>c.min-a.min);
const GCOL = ['#1B5E20','#2E7D32','#9E9D24','#F9A825','#EF6C00','#C62828','#8E0000','#4E342E'];
const gradeColors = () => GL().map((_,i,a)=>GCOL[Math.round(i*(GCOL.length-1)/Math.max(1,a.length-1))]);
const cellText = v => isMark(v) ? `${v}-${grade(v)}` : isAb(v) ? 'Ab' : '';
const uid = () => Math.random().toString(36).slice(2,10);
const sortClasses = a => [...a].sort((x,y)=>x.name.localeCompare(y.name,undefined,{numeric:true,sensitivity:'base'}));
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const filled = cls => cls.students.filter(s=>(s.admissionNo||'').trim()||(s.name||'').trim());
const profName = (y,t) => `${t} Term Marks Schedule ${y}`;
function rankMap(rows){
  const r = rows.filter(x=>x.marks.some(isMark)).sort((a,b)=>b.total-a.total);
  const m = new Map(); let prev=null, pr=0;
  r.forEach((x,i)=>{ const k = prev!==null && x.total===prev ? pr : i+1; m.set(x.s.id,k); prev=x.total; pr=k; });
  return m;
}

// ---------- Store ----------
const KEY = 'bcc-marks-v2';
let MODE = 'admin';             // 'teacher' when a class teacher opened a private link
// Online edition: data lives in Firebase Firestore; S is the in-memory copy kept in sync.
let S = {school:{name:'',logo:''},settings:{},profiles:[],activeId:null};
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.profiles) return normalise(d); }catch(e){}
  return normalise(migrateV1() || {school:{name:'',logo:''},profiles:[],activeId:null});
}
function splitSenior(p){ // older files had one Secondary section for Grades 6–11 with two divisors
  const s=p.sections&&p.sections.Secondary; if(!s||!s.div||(s.div.lower==null&&s.div.upper==null)) return;
  const hasSenior=(p.classes||[]).some(c=>{ const g=gradeNo(c.name); return g>=10&&g<=11; });
  if(hasSenior&&!p.sections['Senior Secondary']) p.sections['Senior Secondary']={subjects:[...s.subjects],div:{all:s.div.upper??9},grades:s.grades,pass:s.pass};
  s.div={all:s.div.lower??12};
}
function normalise(d){ // older files kept one marksheet per section; merge them into one marksheet per term
  if(!d.profiles.some(p=>p.section)){ d.profiles.forEach(splitSenior); return d; }
  const byTerm={}, out=[];
  d.profiles.forEach(p=>{
    if(!p.section){ out.push(p); return; }
    const k=p.year+'|'+p.term; let t=byTerm[k];
    if(!t){ t=byTerm[k]={id:p.id,year:p.year,term:p.term,name:profName(p.year,p.term),sections:{},classes:[],created:p.created||Date.now()}; out.push(t); }
    if(d.activeId===p.id) d.activeId=t.id;
    t.sections[p.section]={subjects:p.subjects||[],div:p.div||{}};
    t.classes.push(...(p.classes||[]));
  });
  out.forEach(p=>{ p.sections=p.sections||{}; p.classes=sortClasses(p.classes||[]); splitSenior(p); });
  d.profiles=out; return d;
}
function migrateV1(){ // bring over data from the first version, if any
  try{
    const o = JSON.parse(localStorage.getItem('bcc-marks-v1')); if(!o||!o.profile) return null;
    const st = {school:{name:o.profile.schoolName||'',logo:o.profile.logo||''},profiles:[],activeId:null};
    const terms = {...(o.archives||{})}; terms[`${o.profile.year}|${o.profile.term}`]=o.classes;
    const subs = [...SUGGEST.Secondary,'Commerce','ICT','Home Econ','Designing','Tamil Lit','Arab Lit'];
    Object.entries(terms).forEach(([k,cl])=>{ if(!cl||!cl.length) return; const [y,t]=k.split('|');
      st.profiles.push({id:uid(),year:y,term:t,section:'Secondary',name:profName(y,t),subjects:subs,div:{lower:12,upper:9,all:subs.length},classes:cl,created:Date.now()}); });
    return st;
  }catch(e){ return null; }
}
function save(){ if(MODE==='admin'&&S.activeId){ try{ localStorage.setItem('bcc-active',S.activeId); }catch(e){} } queueSync(); }
const P = () => S.profiles.find(p=>p.id===S.activeId) || null;
const getClass = id => P()?.classes.find(c=>c.id===id);
const SECKEYS = Object.keys(SECTIONS);
const secOf = cls => { const g=gradeNo(typeof cls==='string'?cls:cls.name); return SECKEYS.find(k=>g>=SECTIONS[k].from&&g<=SECTIONS[k].to)||null; };
const secData = (prof, sec) => (prof && prof.sections && prof.sections[sec]) || {subjects:[],div:{}};
function useBands(cls, prof=P()){ const d=secData(prof,secOf(cls)); GB=normBands(d.grades); PASS=(d.pass!=null&&d.pass!=='')?+d.pass:35; }
const usedSecs = prof => SECKEYS.filter(k=>secData(prof,k).subjects.length);
const subjectsFor = (cls, prof=P()) => { const all = secData(prof,secOf(cls)).subjects; return (cls.subjects && cls.subjects.length) ? all.filter(s=>cls.subjects.includes(s)) : all; };
const divisorFor = (cls, prof=P()) => {
  const sec=secOf(cls), d=secData(prof,sec).div||{};
  let v = d.all;
  v = Number(v); return v>0 ? v : subjectsFor(cls,prof).length || 1;
};
function setMark(cid,sid,sub,val){
  const c = getClass(cid); c.marks[sid] = c.marks[sid]||{};
  if(val===null||Number.isNaN(val)) delete c.marks[sid][sub]; else c.marks[sid][sub]=val;
  save();
}
const termOrder = p => Number(p.year)*10 + TERMS.indexOf(p.term);

// ---------- UI helpers ----------
function toast(msg,type='ok'){ const t=document.createElement('div'); t.className='t '+type; t.textContent=msg; document.getElementById('toast').appendChild(t); setTimeout(()=>t.remove(),2800); }
const $ = s => document.querySelector(s);
const view = h => { const v=$('#view'); if(v) v.innerHTML = h; };
const CAP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>';
function modal(html,cls=''){ $('#modal').innerHTML = `<div class="modal-bg"><div class="modal ${cls}">${html}</div></div>`; }
function closeModal(){ $('#modal').innerHTML=''; }
function download(name, content, mime){
  const b = content instanceof Blob ? content : new Blob([content],{type:mime});
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
}
function classTiles(list, onclick, extra=c=>`${esc(secOf(c)||'')} · ${filled(c).length} students`){
  if(!list.length) return `<div class="card empty">No classes yet. Add classes first in "Students & Classes".</div>`;

}

function uploadLogo(f){
  if(!f) return; if(f.size>3*1024*1024) return toast('Logo must be under 3MB','err');
  const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const c=document.createElement('canvas'); const k=Math.min(1,300/Math.max(im.width,im.height)); c.width=Math.round(im.width*k);c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height); S.school.logo=c.toDataURL('image/png'); save(); toast('Logo uploaded'); pageSetup(); }; im.src=r.result; }; r.readAsDataURL(f);
}

    return {subjects:subs, divAll:d&&d.subjects.length?(d.div&&d.div.all?d.div.all:''):(DEFDIV[k]||''),
      grades:normBands(src.grades).map(b=>({g:b.g,min:String(b.min)})), pass:String(src.pass??35)}; };

function pfSortedBands(){ return PF.secs[PF.tab].grades.map((b,i)=>({...b,i,n:b.min===''?NaN:+b.min})).sort((a,b)=>(isNaN(b.n)?-1:b.n)-(isNaN(a.n)?-1:a.n)); }
function pfBandRows(){ const L=pfSortedBands(); return L.map((b,k)=>{ const to=k===0?100:(isNaN(L[k-1].n)?'':L[k-1].n-1);
  return `<tr><td><input value="${esc(b.g)}" maxlength="3" style="text-align:center;font-weight:700" oninput="PF.secs[PF.tab].grades[${b.i}].g=this.value;pfBandRefresh(false)"></td>
  <td><input type="number" min="0" max="100" value="${esc(b.min)}" style="text-align:center" oninput="PF.secs[PF.tab].grades[${b.i}].min=this.value;pfBandRefresh(false)" onchange="pfBandRefresh(true)"></td>
  <td class="p" style="text-align:center">${to}</td><td style="text-align:center"><button class="x" style="height:30px" onclick="PF.secs[PF.tab].grades.splice(${b.i},1);pfBandRefresh(true)">✕</button></td></tr>`; }).join(''); }
function pfBandPreview(){ const L=pfSortedBands().filter(b=>b.g.trim()&&!isNaN(b.n)); return L.length?bandText(L.map(b=>({g:b.g.trim(),min:b.n})),' · '):'—'; }
function pfBandRefresh(full){ if(full){ const t=$('#pfBands'); if(t) t.innerHTML=pfBandRows(); } const pv=$('#pfBandPrev'); if(pv) pv.textContent=pfBandPreview(); }
function pfBandAdd(){ PF.secs[PF.tab].grades.push({g:'',min:''}); pfBandRefresh(true); const ins=document.querySelectorAll('#pfBands input'); }
function pfPreset(k){ PF.secs[PF.tab].grades=BAND_PRESETS[k].map(b=>({g:b.g,min:String(b.min)})); drawProfileForm(); }
function checkBands(sec){ const D=PF.secs[sec]; const L=D.grades.filter(b=>String(b.g).trim()||String(b.min).trim());
  if(!L.length) return `Add at least one ${sec} grade.`;
  if(L.some(b=>!String(b.g).trim())) return `Every ${sec} grade needs a letter.`;
  if(L.some(b=>String(b.min).trim()===''||isNaN(+b.min)||+b.min<0||+b.min>100||!Number.isInteger(+b.min))) return `${sec} grade "From" marks must be whole numbers from 0 to 100.`;
  const lt=L.map(b=>String(b.g).trim().toUpperCase()); if(new Set(lt).size!==lt.length) return `Two ${sec} grades use the same letter.`;
  const mins=L.map(b=>+b.min); if(new Set(mins).size!==mins.length) return `Two ${sec} grades start at the same mark.`;
  if(!mins.includes(0)) return `The lowest ${sec} grade must start at 0.`;
  const ps=String(D.pass).trim(); if(ps===''||isNaN(+ps)||+ps<0||+ps>100) return `${sec} pass mark must be from 0 to 100.`;
  return ''; }
function pfName(){ const e=$('#pfName'); if(e) e.textContent=profName(PF.year,PF.term); }
function pfDiv(){}
function pfAdd(){ const e=$('#pfNew'); const v=e.value.trim(); if(!v) return e.focus(); const D=PF.secs[PF.tab];
  if(D.subjects.some(s=>s.name.trim().toLowerCase()===v.toLowerCase())){ toast(`"${v}" is already in the ${PF.tab} list`,'err'); return; }
  D.subjects.push({orig:null,name:v}); PF.err=''; drawProfileForm(true); }
function pfSuggest(){ const D=PF.secs[PF.tab]; SUGGEST[PF.tab].forEach(s=>{ if(!D.subjects.some(x=>x.name.trim().toLowerCase()===s.toLowerCase())) D.subjects.push({orig:null,name:s}); }); drawProfileForm(); }
function pfMove(i,d){ const L=PF.secs[PF.tab].subjects, j=i+d; if(j<0||j>=L.length) return; [L[i],L[j]]=[L[j],L[i]]; drawProfileForm(); }
const moveItem = (L,from,to) => { if(from===to) return; const [x]=L.splice(from,1); L.splice(to,0,x); };
function bindDrag(sel,onMove){ const box=$(sel); if(!box) return; let from=null;
  box.querySelectorAll('[draggable="true"][data-i]').forEach(row=>{
    row.addEventListener('dragstart',e=>{ from=+row.dataset.i; row.classList.add('drag'); e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',String(from));}catch(_){} });
    row.addEventListener('dragend',()=>{ row.classList.remove('drag'); box.querySelectorAll('.over').forEach(r=>r.classList.remove('over')); });
    row.addEventListener('dragover',e=>{ e.preventDefault(); box.querySelectorAll('.over').forEach(r=>r.classList.remove('over')); row.classList.add('over'); });
    row.addEventListener('drop',e=>{ e.preventDefault(); const to=+row.dataset.i; if(from!==null&&!isNaN(to)) onMove(from,to); from=null; });
  }); }
// "Subject order" window — used from Students & Classes and the Marks Schedule preview
let OM=null;
function openOrder(sec,after){ OM={sec,after,list:[...secData(P(),sec).subjects]}; drawOrder(); }
function drawOrder(){ const L=OM.list;
  modal(`<h2>Subject order — ${esc(OM.sec)}</h2><div class="hint">Drag ⠿ or use ↑ ↓. This sets the column order in the marks table, A3 sheet and Excel for every ${esc(OM.sec)} class in ${esc(P().name)}. Marks are not changed.</div>
    <div id="omList">${L.map((x,i)=>`<div class="subj" draggable="true" data-i="${i}"><span class="hd" title="Drag to reorder">⠿</span><span class="ix">${i+1}.</span><div class="ordname">${esc(x)}</div>
      <button class="x" onclick="omMove(${i},-1)" ${i===0?'disabled':''}>↑</button><button class="x" onclick="omMove(${i},1)" ${i===L.length-1?'disabled':''}>↓</button></div>`).join('')}</div>
    <div class="foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="omSave()">Save order</button></div>`,'smm');
  bindDrag('#omList',(a,b)=>{ moveItem(OM.list,a,b); drawOrder(); }); }

function omSave(){ P().sections[OM.sec].subjects=OM.list; save(); closeModal(); toast(`${OM.sec} subject order saved`); if(OM.after) OM.after(); }
function pfSave(){
  const err = (m,tab) => { PF.err=m; if(tab) PF.tab=tab; drawProfileForm(); };
  const subs={}, divs={}; let total=0;
  for(const k of SECKEYS){
    const D=PF.secs[k]; subs[k]=D.subjects.map(s=>({...s,name:s.name.trim()})).filter(s=>s.name);
    const low=subs[k].map(s=>s.name.toLowerCase()); if(new Set(low).size!==low.length) return err(`Two ${k} subjects have the same name.`,k);
    total+=subs[k].length;
    if(subs[k].length){ const e=checkBands(k); if(e) return err(e,k); }
    divs[k]={all:(+D.divAll>0?+D.divAll:null)};
  }
  if(!total) return err('Add subjects to at least one section (Primary, Secondary, Senior Secondary or A.L).');
  if(S.profiles.some(p=>p.id!==PF.id && p.year===PF.year && p.term===PF.term)) return err(`A marksheet for ${PF.term} Term ${PF.year} already exists.`);
  const sections = Object.fromEntries(SECKEYS.filter(k=>subs[k].length).map(k=>[k,{subjects:subs[k].map(s=>s.name),div:divs[k],
    grades:normBands(PF.secs[k].grades.filter(b=>String(b.g).trim()).map(b=>({g:String(b.g).trim(),min:+b.min}))), pass:+PF.secs[k].pass}]));
  if(PF.id){
    const p = S.profiles.find(x=>x.id===PF.id);
    for(const k of SECKEYS) if(!subs[k].length && p.classes.some(c=>secOf(c)===k)) return err(`This marksheet has ${k} classes — keep at least one ${k} subject.`,k);
    const removed={}, ren={}; let n=0;
    SECKEYS.forEach(k=>{ removed[k]=secData(p,k).subjects.filter(o=>!subs[k].some(s=>s.orig===o)); ren[k]={}; subs[k].forEach(s=>{ if(s.orig && s.orig!==s.name) ren[k][s.orig]=s.name; }); });
    p.classes.forEach(c=>{ const k=secOf(c); if(!k) return; Object.values(c.marks).forEach(m=>removed[k].forEach(r=>{ if(m[r]!==undefined) n++; })); });
    if(n && !PF.confirm){ PF.confirm=true; return err(`Removing ${SECKEYS.filter(k=>removed[k].length).map(k=>`${k}: ${removed[k].join(', ')}`).join(' · ')} will delete ${n} entered mark(s). Click "Confirm & Save" to continue.`); }
    p.classes.forEach(c=>{ const k=secOf(c); if(!k) return; const R=removed[k], M=ren[k];
      Object.keys(c.marks).forEach(sid=>{ const nm={}; Object.entries(c.marks[sid]).forEach(([a,v])=>{ if(R.includes(a)) return; nm[M[a]||a]=v; }); c.marks[sid]=nm; });
      const st={}; Object.entries(c.subjectTeachers||{}).forEach(([a,v])=>{ if(!R.includes(a)) st[M[a]||a]=v; }); c.subjectTeachers=st;
      if(c.subjects) c.subjects = c.subjects.filter(a=>!R.includes(a)).map(a=>M[a]||a);
    });
    Object.assign(p,{year:PF.year,term:PF.term,name:profName(PF.year,PF.term),sections});
    save(); closeModal(); toast('Marksheet updated'); route();
  } else {
    let classes=[];
    if(PF.copyFrom){ const src=S.profiles.find(x=>x.id===PF.copyFrom);
      classes = src.classes.filter(c=>sections[secOf(c)]).map(c=>{ const keep=sections[secOf(c)].subjects; const cs=c.subjects?c.subjects.filter(x=>keep.includes(x)):null;
        return {id:uid(),name:c.name,teacher:c.teacher,students:c.students.map(s=>({...s,id:uid()})),marks:{},subjectTeachers:{...(c.subjectTeachers||{})},subjects:cs&&cs.length?cs:null}; }); }
    const p = {id:uid(),year:PF.year,term:PF.term,name:profName(PF.year,PF.term),sections,classes:sortClasses(classes),created:Date.now()};
    S.profiles.push(p); save(); closeModal(); toast(`"${p.name}" created`); pageSetup();
  }
}

function parseMark(raw){ const a=String(raw).trim(); if(a==='') return null; if(/^a$|^ab$/i.test(a)) return -1; const n=Number(a); return (isNaN(n)||n<0||n>100)?undefined:n; }
function bindMarkInputs(c, sub){
  const tb=$('#mkBody');

// ---------- Schedule computation (same method as before) ----------
function computeSchedule(cls, prof=P()){
  useBands(cls,prof);
  const c = {...cls, students:filled(cls)}; const subs = subjectsFor(cls,prof); const div = divisorFor(cls,prof);
  const used = {}; subs.forEach(s=>used[s]=c.students.some(st=>isMark(c.marks[st.id]?.[s])));
  let rows = c.students.map(st=>{ const marks=subs.map(s=>c.marks[st.id]?.[s]); const ok=marks.filter(isMark); const total=ok.reduce((a,b)=>a+b,0);
    const counts=zeroCounts(); ok.forEach(m=>counts[grade(m)]++); return {s:st,marks,total,avg:total/div,counts}; });
  const rk = rankMap(rows); rows = rows.map(r=>({...r,rank:rk.get(r.s.id)}));
  const subStats = subs.map(s=>{ const ms=c.students.map(st=>c.marks[st.id]?.[s]).filter(isMark); const g=zeroCounts(); ms.forEach(m=>g[grade(m)]++);
    let hi=-1,hs=''; c.students.forEach(st=>{ const v=c.marks[st.id]?.[s]; if(isMark(v)&&v>hi){hi=v;hs=st.name;} });
    return {sub:s,...g,n:ms.length,avg:ms.length?ms.reduce((a,b)=>a+b,0)/ms.length:0,passPct:ms.length?ms.filter(m=>m>=PASS).length/ms.length*100:0,
      above40:ms.filter(m=>m>=40).length,below40:ms.filter(m=>m<40).length,hi:hi>=0?hi:null,hiStudent:hs,teacher:c.subjectTeachers?.[s]||'',used:used[s]}; });
  return {c,subs,div,used,rows,subStats};
}

// ---------- A3 schedule (print-ready) ----------
function a3HTML(cls, prof=P()){
  const {c,subs,div,rows,subStats} = computeSchedule(cls,prof); const sc=S.school;
  const N = Math.max(ROWS, rows.length), nb = GL().length, ns = subs.length;
  const tableH = 283 - 31 - 2.2 - 2 - 13 - 1.5;      // mm available for the body (everything is sized to stay on ONE A3 page)
  const headH = 24, rowH = Math.min(4.6,(tableH-headH)/N);
  const mFont = Math.min(rowH<3.2?6.2:rowH<3.7?6.9:7.6, ns>22?6.2:ns>18?6.8:7.6);
  const keyH = 12, sideRows = 2*(ns+2) + 5;

function analyticsFor(cls, prof=P()){
  const {c,subs,div,rows,subStats} = computeSchedule(cls,prof);
  const present = rows.filter(r=>r.marks.some(isMark));
  const classAverage = present.length?present.reduce((a,r)=>a+r.avg,0)/present.length:0;
  const passRate = present.length?present.filter(r=>r.avg>=PASS).length/present.length*100:0;
  const subjectAvgs = subStats.filter(x=>x.used).map(x=>({sub:x.sub,avg:x.avg,passRate:x.passPct,n:x.n,above40:x.above40,below40:x.below40,hi:x.hi,lo:x.n?Math.min(...c.students.map(st=>c.marks[st.id]?.[x.sub]).filter(isMark)):null}));
  const sorted = [...subjectAvgs].sort((a,b)=>b.avg-a.avg);
  const ranked = [...present].sort((a,b)=>(a.rank||999)-(b.rank||999));
  const top = ranked[0], last = ranked[ranked.length-1];
  const subjOf = r => r ? subs.map((s,k)=>({sub:s,mark:isMark(r.marks[k])?r.marks[k]:null})).filter(x=>x.mark!==null) : [];
  const bands=[['0-19',0,19],['20-34',20,34],['35-49',35,49],['50-64',50,64],['65-74',65,74],['75-100',75,100]].map(([l,a,b])=>({label:l,count:present.filter(r=>r.avg>=a&&r.avg<=b+.999).length}));
  const gradeTotals=zeroCounts(); subStats.forEach(x=>GL().forEach(g=>gradeTotals[g]+=x[g]));
  return {c,subs,div,rows,present,ranked,classAverage,passRate,subjectAvgs,bestSubject:sorted[0],weakSubject:sorted[sorted.length-1],
    above75:present.filter(r=>r.avg>=75).length,below20:present.filter(r=>r.avg<20).length,top,last,topSubjects:subjOf(top),lastSubjects:subjOf(last),bands,gradeTotals,
    highest:present.length?Math.max(...present.map(r=>r.avg)):0,lowest:present.length?Math.min(...present.map(r=>r.avg)):0};
}
function bars(data,{w=560,h=240,max=100,color='#1e3a5f',colors=null,rot=true,key='value',labelKey='name'}={}){
  if(!data.length) return `<div class="hint" style="padding:30px;text-align:center">No data</div>`;
  if(max!==100){ max=[4,8,20,40,100,200,400].find(v=>v>=max)||Math.ceil(max/100)*100; }
  const pl=34,pb=rot?62:26,pt=14,pr=8, cw=(w-pl-pr)/data.length, bw=Math.min(46,cw*.65), H=h-pt-pb;
  let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="font-family:system-ui;font-size:10px">`;
  for(let i=0;i<=4;i++){ const y=pt+H-H*i/4; s+=`<line x1="${pl}" x2="${w-pr}" y1="${y}" y2="${y}" stroke="#ddd" stroke-dasharray="3 3"/><text x="${pl-4}" y="${y+3}" text-anchor="end" fill="#555">${Math.round(max*i/4)}</text>`; }
  data.forEach((d,i)=>{ const v=d[key]||0; const bh=H*Math.min(v,max)/max; const x=pl+cw*i+(cw-bw)/2, y=pt+H-bh; const colr=colors?colors[i]:color;
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${colr}" rx="2"/><text x="${x+bw/2}" y="${y-3}" text-anchor="middle" font-weight="700" fill="#222">${typeof v==='number'?(Number.isInteger(v)?v:v.toFixed(1)):v}</text>`;
    const lx=pl+cw*i+cw/2, ly=pt+H+12;
    s+= rot?`<text transform="translate(${lx},${ly}) rotate(-35)" text-anchor="end" fill="#333">${esc(d[labelKey])}</text>`:`<text x="${lx}" y="${ly}" text-anchor="middle" fill="#333">${esc(d[labelKey])}</text>`; });
  return s+`<line x1="${pl}" x2="${w-pr}" y1="${pt+H}" y2="${pt+H}" stroke="#333"/></svg>`;
}

function buildParentReport(prof,c,st){ {

    const rows=sch.subs.map((s,k)=>{ const ms=sch.c.students.map(x=>c.marks[x.id]?.[s]).filter(isMark); const m=me.marks[k];
      const sr = isMark(m)? 1+ms.filter(v=>v>m).length : null;
      return {subject:s,mark:m,offered:m!==undefined,grade:isMark(m)?grade(m):'',classAvg:ms.length?(ms.reduce((a,b)=>a+b,0)/ms.length).toFixed(1):null,classBest:ms.length?Math.max(...ms):null,subjectRank:sr?`${sr} / ${ms.length}`:null}; });

const SY={db:null,last:{},timer:null,pending:0,err:null,unsubs:[]};
function diffPairs(a,b){ const pairs=[]; a=a||{}; b=b||{};
  new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{ if(k==='marks') return; if(sj(a[k])!==sj(b[k])) pairs.push([[k], b[k]===undefined?DEL:b[k]]); });
  const am=a.marks||{}, bm=b.marks||{};
  new Set([...Object.keys(am),...Object.keys(bm)]).forEach(sid=>{
    if(!(sid in bm)) return pairs.push([['marks',sid],DEL]);
    if(!(sid in am)) return pairs.push([['marks',sid],bm[sid]]);
    const x=am[sid]||{}, y=bm[sid]||{};
    new Set([...Object.keys(x),...Object.keys(y)]).forEach(sub=>{ if(x[sub]!==y[sub]) pairs.push([['marks',sid,sub], sub in y?y[sub]:DEL]); });
  });
  return pairs; }

function flush(){

    if(SY.last[k]!==undefined && sj(classDoc(c))!==SY.last[k]){ c.updatedAt=Date.now(); c.updatedBy=c.teacher||'Class teacher'; } }
  const now=localDocs(), ops=[];
  Object.entries(now).forEach(([k,d])=>{ const js=sj(d); if(SY.last[k]===js) return;
    if(SY.last[k]===undefined || !isClassPath(k)) ops.push(['set',k,d,js]);
    else { const pairs=diffPairs(JSON.parse(SY.last[k]),d); if(!pairs.length){ SY.last[k]=js; return; } ops.push(pairs.length>300?['set',k,d,js]:['update',k,pairs,js]); } });
  if(MODE!=='teacher') Object.keys(SY.last).forEach(k=>{ if(!(k in now)) ops.push(['del',k]); });
  ops.forEach(([kind,k,d,js])=>{

    SY.pending++;
    const pr = kind==='set'?SY.db.set(k,d) : kind==='update'?SY.db.update(k,d) : SY.db.del(k);

    <div class="row" style="gap:8px"><a class="btn ${on==='parents'?'':'out'}" href="#/access/parents">👪 Parent Access</a><a class="btn ${on==='teachers'?'':'out'}" href="#/access/teachers">🧑‍🏫 Teacher Access</a></div></div>`;
}
const newToken = () => Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
const appBase = () => location.href.split('#')[0].split('?')[0] + (MOCK?'?mock=1':'');
const waNum = p => { let d=String(p||'').replace(/\D/g,''); if(d.length===10&&d[0]==='0') d='94'+d.slice(1); return d; };
function copyText(t){ const done=()=>toast('Copied — paste it into WhatsApp, SMS or email');
  if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(t).then(done,()=>fallback()); fallback();
  function fallback(){ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand('copy'); done();}catch(e){ toast('Copy failed — select and copy manually','err'); } a.remove(); } }

// ---- ADMIN: Teacher Access ----
let TA={year:null,term:null};
const teacherLink = c => `${appBase()}#/t/${c.access.token}`;
function pageTeacherAccess(){
  const act=P(); if(TA.year===null){ TA.year=act?act.year:YEARS[1]; TA.term=act?act.term:'1st'; }
  const p=S.profiles.find(x=>x.year===TA.year&&x.term===TA.term);
  view(accessTabs('teachers')+`<div class="page">
    <div class="card"><h3>1. Choose year and term</h3><div class="row">
      <div><label class="l">Year</label><select class="inp" onchange="TA.year=this.value;pageTeacherAccess()">${YEARS.map(y=>`<option ${y===TA.year?'selected':''}>${y}</option>`).join('')}</select></div>
      <div><label class="l">Term</label><select class="inp" onchange="TA.term=this.value;pageTeacherAccess()">${TERMS.map(t=>`<option value="${t}" ${t===TA.term?'selected':''}>${t} Term</option>`).join('')}</select></div>
      <div class="hint" style="flex:1;min-width:220px">${p?`Marksheet: <b>${esc(p.name)}</b> · ${p.classes.length} class(es)`:'No marksheet for this year and term. Create one in Setup Profile.'}</div></div></div>
    <div class="card"><h3>2. Class teacher links</h3>
      <div class="hint" style="margin-bottom:10px">Each link opens <b>only that class</b>. The teacher can edit its students and marks, and print its A3 sheet. Their marks are <b>saved online as they type</b> and appear here automatically. <b>⟳ New</b> makes a new link and switches the old one off.</div>
      ${!p||!p.classes.length?'<div class="empty" style="padding:24px">No classes in this marksheet.</div>':
      `<div class="scroll" style="max-height:none"><table class="dt"><thead><tr><th>Class</th><th>Class Teacher</th><th style="width:150px">WhatsApp no.</th><th style="width:190px">Email</th><th>Status</th><th style="width:330px">Send private link</th></tr></thead><tbody>`+
      sortClasses(p.classes).map(c=>{ const a=c.access, ct=c.contact||{};
        return `<tr><td class="p"><b>${esc(c.name)}</b><div class="hint">${esc(secOf(c)||'')}</div></td><td class="p">${esc(c.teacher||'—')}</td>
          <td><input value="${esc(ct.phone||'')}" placeholder="07X…" onchange="taContact('${p.id}','${c.id}','phone',this.value)"></td>
          <td><input value="${esc(ct.email||'')}" placeholder="name@mail.com" onchange="taContact('${p.id}','${c.id}','email',this.value)"></td>
          <td class="p" style="font-size:12px">${a?`<span class="badge" style="background:#dcfce7">Active</span><div class="hint">since ${new Date(a.created).toLocaleDateString()}</div>`:'<span class="hint">No link yet</span>'}${c.updatedAt?`<div class="hint">last edit ${new Date(c.updatedAt).toLocaleString()}${c.updatedBy?` by ${esc(c.updatedBy)}`:''}</div>`:''}</td>
          <td class="p">${a?`<div class="row" style="gap:6px"><button class="btn sm" onclick="taSend('${p.id}','${c.id}','wa')">WhatsApp</button><button class="btn sm out" onclick="taSend('${p.id}','${c.id}','mail')">Email</button><button class="btn sm out" onclick="taSend('${p.id}','${c.id}','copy')">Copy</button>
            <button class="btn sm ghost" title="Make a new link and switch the old one off" onclick="taNew('${p.id}','${c.id}')">⟳ New</button><button class="btn sm ghost" title="Remove access" onclick="taRemove('${p.id}','${c.id}')">✕</button></div>`
            :`<button class="btn sm" onclick="taNew('${p.id}','${c.id}')">＋ Create link</button>`}</td></tr>`; }).join('')+`</tbody></table></div>`}
    </div></div>`);
}
const findClass = (pid,cid) => S.profiles.find(x=>x.id===pid).classes.find(x=>x.id===cid);
function taContact(pid,cid,k,v){ const c=findClass(pid,cid); c.contact={...(c.contact||{}),[k]:v.trim()}; save(); }
async function taNew(pid,cid){ const c=findClass(pid,cid); const old=c.access&&c.access.token; const token=newToken();
  try{ await ADB.set('linkTokens/'+token,{pid,cid,created:Date.now()}); if(old) await ADB.del('linkTokens/'+old); }
  catch(e){ return toast('Could not create the link: '+((e&&e.code)||e),'err'); }
  c.access={token,created:Date.now()}; save(); toast(old?`New link for ${c.name} — the old link no longer works`:`Link created for ${c.name}`); pageTeacherAccess(); }
function taRemove(pid,cid){ const c=findClass(pid,cid);
  modal(`<h2>Remove ${esc(c.name)} teacher access?</h2><p class="hint" style="font-size:14px">The teacher's link will stop working straight away. You can create a new link later.</p><div class="foot"><button class="btn out" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="taRemoveGo('${pid}','${cid}')">Remove</button></div>`,'smm'); }
async function taRemoveGo(pid,cid){ const c=findClass(pid,cid); closeModal(); try{ if(c.access) await ADB.del('linkTokens/'+c.access.token); }catch(e){ return toast('Could not remove access: '+((e&&e.code)||e),'err'); }
  delete c.access; save(); toast('Access removed'); pageTeacherAccess(); }
function taSend(pid,cid,how){ const p=S.profiles.find(x=>x.id===pid), c=findClass(pid,cid), link=teacherLink(c);
  const msg=`Dear ${c.teacher||'Class Teacher'},\n\nThis is your private link to the ${S.school.name||'school'} marks system for Class ${c.name} — ${p.name}.\n\n${link}\n\nOpen it on your phone or computer. It shows only Class ${c.name}: you can update student names and enter marks. Everything is saved online automatically as you type.\n\nPlease do not share this link with anyone.`;
  const ct=c.contact||{};
  if(how==='wa') window.open(`https://wa.me/${waNum(ct.phone)}?text=${encodeURIComponent(msg)}`,'_blank');
  else if(how==='mail') location.href=`mailto:${encodeURIComponent(ct.email||'')}?subject=${encodeURIComponent(`Marks entry link — Class ${c.name} — ${p.name}`)}&body=${encodeURIComponent(msg)}`;
  else copyText(msg);
}

// ---- ADMIN: publish results for parents ----
const admKey = a => String(a||'').trim().toLowerCase().replace(/[^a-z0-9_-]/g,'_');
let PUB={pid:null,busy:false};
function publishCard(){
  const list=[...S.profiles].sort((a,b)=>termOrder(b)-termOrder(a)); if(PUB.pid===null) PUB.pid=S.school.publishedPid||S.activeId||'';
  const pub=S.profiles.find(p=>p.id===S.school.publishedPid); const link=`${appBase()}#/parent`;
  return `<div class="page" style="padding-bottom:0"><div class="card"><h3>Publish results for parents</h3>
    <p class="hint" style="font-size:13px">Parents open one link, type their child's admission number and see only that child's results. They see the results you <b>publish</b> — publish again after you change marks.</p>
    <div class="row"><div style="flex:1;min-width:240px"><label class="l">Marksheet to publish</label><select class="inp" onchange="PUB.pid=this.value">${list.map(p=>`<option value="${p.id}" ${p.id===PUB.pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
      <button class="btn" ${PUB.busy?'disabled':''} onclick="publishParents()">${PUB.busy?'Publishing…':'📢 Publish results'}</button>
      ${pub?`<button class="btn out" onclick="unpublishParents()">Unpublish</button>`:''}</div>
    <p style="font-size:13px;margin:10px 0 0">${pub?`Published: <b>${esc(pub.name)}</b> · ${new Date(S.school.publishedAt).toLocaleString()}`:'<span class="hint">Nothing is published yet.</span>'}</p>
    <div class="row" style="margin-top:10px;flex-wrap:nowrap"><input class="inp" readonly value="${esc(link)}"><button class="btn out" onclick="copyText('${esc(link)}')">Copy parent link</button><a class="btn out" href="https://wa.me/?text=${encodeURIComponent(`Results of ${S.school.name||'our school'} are now available. Open this link and type your child's admission number:\n${link}`)}" target="_blank">WhatsApp</a></div>
  </div></div>`;
}
async function publishParents(){
  const p=S.profiles.find(x=>x.id===PUB.pid); if(!p) return toast('Choose a marksheet','err');
  PUB.busy=true; pageParents(false);
  try{
    const ops=[], keep=new Set();
    p.classes.forEach(c=>filled(c).forEach(st=>{ const k=admKey(st.admissionNo); if(!k||keep.has(k)) return; keep.add(k);
      ops.push(['set','parentResults/'+k,clone({...buildParentReport(p,c,st),schoolName:S.school.name||'',publishedAt:Date.now()})]); }));
    (await ADB.list('parentResults')).forEach(d=>{ if(!keep.has(d.id)) ops.push(['del','parentResults/'+d.id]); });
    await ADB.batch(ops);
    S.school.publishedPid=p.id; S.school.publishedAt=Date.now(); save(); toast(`Published ${keep.size} student result(s) for parents`);
  }catch(e){ toast('Could not publish: '+((e&&e.code)||e),'err'); }
  PUB.busy=false; pageParents(false);
}
async function unpublishParents(){ try{ const ops=(await ADB.list('parentResults')).map(d=>['del','parentResults/'+d.id]); await ADB.batch(ops); S.school.publishedPid=null; S.school.publishedAt=null; save(); toast('Results unpublished'); }
  catch(e){ toast('Could not unpublish: '+((e&&e.code)||e),'err'); } pageParents(false); }
async function parentSearch(standalone){
  const q=document.getElementById('pq').value.trim(); PA.q=q; if(!q){ PA.r=undefined; return pageParents(standalone); }
  if(!standalone){ PA.r=parentReport(q); return pageParents(false); }
  PA.busy=true; pageParents(true);
  try{ const r=await ADB.get('parentResults/'+admKey(q)); PA.r=r||null; }catch(e){ PA.r=null; toast('Could not search. Check your internet connection.','err'); }
  PA.busy=false; pageParents(true);
}

// ---- TEACHER MODE (private link → one class only) ----
function teacherLinks(){ try{ return JSON.parse(localStorage.getItem('bcc-teacher-links')||'[]'); }catch(e){ return []; } }
function rememberLink(t){ const l=teacherLinks().filter(x=>x.token!==t.token); l.unshift(t); try{ localStorage.setItem('bcc-teacher-links',JSON.stringify(l.slice(0,6))); }catch(e){} }
function forgetLink(token){ try{ localStorage.setItem('bcc-teacher-links',JSON.stringify(teacherLinks().filter(x=>x.token!==token))); }catch(e){} }
function teacherError(msg,token){ if(token) forgetLink(token); try{ sessionStorage.removeItem('bcc-tmode'); }catch(e){}
  $('#app').innerHTML=`<div class="login"><div class="card"><h3>Class teacher link</h3><p class="err">${esc(msg)}</p><a class="btn" href="#/" onclick="setTimeout(()=>location.reload(),50)">OK</a></div></div>`; }
async function openTeacherLink(raw){
  const token=String(raw||'').trim().replace(/^.*#\/t\//,'').replace(/[^a-f0-9]/gi,'').toLowerCase();
  if(token.length<16) return toast('That does not look like a teacher link','err');
  showLoading('Opening your class…');
  try{
    TDB=TDB||makeDB('teacher'); await TDB.authReady(); if(!TDB.currentUser()) await TDB.signInAnon();
    const uid=TDB.currentUser().uid;
    let tk=null; try{ tk=await TDB.get('linkTokens/'+token); }catch(e){ tk=null; }
    if(!tk) return teacherError('This link is no longer active. Ask the admin to send you a new link.',token);
    await TDB.set('teacherAccess/'+uid,{token,pid:tk.pid,cid:tk.cid,at:Date.now()});
    const [sc,ms,cl]=await Promise.all([TDB.get('school/main'),TDB.get('marksheets/'+tk.pid),TDB.get(`marksheets/${tk.pid}/classes/${tk.cid}`)]);
    if(!ms||!cl) return teacherError('This class could not be found. Ask the admin to send you a new link.',token);
    SY.unsubs.forEach(u=>{ try{u();}catch(e){} }); SY.unsubs=[];
    MODE='teacher'; ONLINE.admin=false;
    S={school:{name:sc?.name||'',logo:sc?.logo||''},settings:{},activeId:tk.pid,teacher:{token},profiles:[{id:tk.pid,year:ms.year,term:ms.term,name:ms.name,sections:ms.sections||{},created:ms.created||0,classes:[{id:tk.cid,...cl}]}]};
    const k=`marksheets/${tk.pid}/classes/${tk.cid}`; SY.db=TDB; SY.last={[k]:sj(classDoc(S.profiles[0].classes[0]))};
    SY.unsubs.push(TDB.watchDoc(k,(d,local)=>{ if(local) return; if(!d) return teacherError('This class was deleted by the admin.',token); if(onRemote(k,d)) remoteRefresh(); },
      ()=>teacherError('Your access to this class has been removed. Ask the admin for a new link.',token)));
    rememberLink({token,cls:cl.name,term:ms.name}); try{ sessionStorage.setItem('bcc-tmode',token); }catch(e){}
    ONLINE.ready=true; history.replaceState(null,'','#/marks'); $('#app').innerHTML=''; route();
  }catch(e){ console.error(e); teacherError('Could not open the class: '+((e&&e.code)||e.message||e)); }
}
async function exitTeacher(){ await flushNow(); try{ sessionStorage.removeItem('bcc-tmode'); }catch(e){} location.hash='#/'; location.reload(); }

// ---- Google Drive backup ----
let GTOKEN=null, GEXP=0, GTC=null;
function loadGIS(){ return new Promise((res,rej)=>{ if(window.google&&google.accounts&&google.accounts.oauth2) return res();
  const s=document.createElement('script'); s.src='https://accounts.google.com/gsi/client'; s.async=true; s.onload=()=>res(); s.onerror=()=>rej(new Error('Could not load Google sign-in')); document.head.appendChild(s); }); }
function driveToken(){ return new Promise((res,rej)=>{ if(GTOKEN&&Date.now()<GEXP) return res(GTOKEN);
  if(!(window.google&&google.accounts&&google.accounts.oauth2)) return rej(new Error('Google sign-in is still loading — try again in a moment.'));
  GTC=google.accounts.oauth2.initTokenClient({client_id:OAUTH_CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file',
    callback:r=>{ if(r.error) return rej(new Error(r.error_description||r.error)); GTOKEN=r.access_token; GEXP=Date.now()+((r.expires_in||3600)-60)*1000; res(GTOKEN); },
    error_callback:e=>rej(new Error(e&&e.type==='popup_closed'?'The Google window was closed.':'Google sign-in failed.'))});
  GTC.requestAccessToken({prompt:''}); }); }
async function gfetch(url,opt={}){ const t=GTOKEN; const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+t}}); if(!r.ok) throw new Error('Google Drive error '+r.status+': '+(await r.text()).slice(0,160)); return r; }
async function driveFolder(){
  const q=encodeURIComponent("name='BCC Marks Backups' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  const r=await (await gfetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,webViewLink)`)).json();
  if(r.files&&r.files.length) return r.files[0];
  return await (await gfetch('https://www.googleapis.com/drive/v3/files?fields=id,name,webViewLink',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'BCC Marks Backups',mimeType:'application/vnd.google-apps.folder'})})).json();
}
async function driveUpload(folderId,name,blob){ const fd=new FormData(); fd.append('metadata',new Blob([JSON.stringify({name,parents:[folderId]})],{type:'application/json'})); fd.append('file',blob,name);
  return await (await gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name',{method:'POST',body:fd})).json(); }
async function backupToDrive(){
  const out=$('#gdOut'), b=$('#gdB'); const say=t=>{ if(out) out.textContent=t; };
  try{ say('Connecting to Google Drive…'); await driveToken(); if(b) b.disabled=true;
    const folder=await driveFolder(); const stamp=new Date().toISOString().slice(0,16).replace('T','_').replace(':','-');
    say('Uploading backup file…'); await driveUpload(folder.id,`marks-backup-${stamp}.json`,new Blob([JSON.stringify(backupObject())],{type:'application/json'}));
    const books=S.profiles.filter(p=>p.classes.length);
    for(const p of books){ say(`Uploading Excel: ${p.name}…`); await driveUpload(folder.id,fileSafe(`${p.name} - ${stamp}.xlsx`),XL.book(sortClasses(p.classes).map(c=>classSheet(c,p)))); }
    S.settings={...(S.settings||{}),lastDriveBackup:Date.now()}; save();
    say(''); if(out) out.innerHTML=`✓ Backed up to Google Drive (1 backup file + ${books.length} Excel workbook(s)). ${folder.webViewLink?`<a href="${folder.webViewLink}" target="_blank">Open the folder</a>`:''}`; toast('Backed up to Google Drive');
  }catch(e){ say(''); toast(String(e.message||e),'err'); }
  if(b) b.disabled=false;
}
async function driveRestoreList(){
  try{ await driveToken(); const folder=await driveFolder();
    const q=encodeURIComponent(`'${folder.id}' in parents and trashed=false and name contains 'marks-backup-'`);
    const r=await (await gfetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=createdTime desc&pageSize=20&fields=files(id,name,createdTime)`)).json();
    const files=r.files||[];
    modal(`<h2>Restore from Google Drive</h2>${files.length?`<div class="hint">Choose a backup. All online data will be replaced (you will be asked to confirm).</div>`+files.map(f=>`<button class="btn out" style="justify-content:space-between;width:100%" onclick="driveRestore('${f.id}')"><span>${esc(f.name)}</span><span class="hint">${new Date(f.createdTime).toLocaleString()}</span></button>`).join(''):'<p class="hint">No backups found in the BCC Marks Backups folder.</p>'}
      <div class="foot"><button class="btn ghost" onclick="closeModal()">Close</button></div>`,'md');
  }catch(e){ toast(String(e.message||e),'err'); }
}
async function driveRestore(id){ try{ const d=await (await gfetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json(); closeModal(); confirmRestore(d); }catch(e){ toast(String(e.message||e),'err'); } }

// =====================================================================
// Router
// =====================================================================
function route(){
  if(!ONLINE.ready) return;
  const h=location.hash||'#/'; closeModal();
  if(h.startsWith('#/t/')) return openTeacherLink(h);
  if(MODE==='teacher'){
    if(!$('#view') || !$('#side')) $('#app').innerHTML='';
    shell(); $('#side').classList.remove('open');
    const hh=location.hash;
    if(hh.startsWith('#/classes')) return pageClasses();
    if(hh.startsWith('#/print')){ PR={mode:'list'}; return pagePrint(); }
    if(hh.startsWith('#/reports')){ RP={mode:'home'}; return pageReports(); }
    if(!hh.startsWith('#/marks')) history.replaceState(null,'','#/marks');
    MK={mode:'list',preview:false,cid:null,sub:null}; return pageMarks();
  }
  if(h==='#/parent'){ PA={q:'',r:undefined}; return pageParents(true); }
  if(!authed()) return renderLogin();
  if(!$('#view') || !$('#side')) $('#app').innerHTML='';
  shell(); $('#side').classList.remove('open');
  if(h.startsWith('#/classes')) return pageClasses();
  if(h.startsWith('#/marks')){ MK={mode:'list',preview:false,cid:null,sub:null}; return pageMarks(); }
  if(h.startsWith('#/print')){ PR={mode:'list'}; return pagePrint(); }
  if(h.startsWith('#/progress')){ SR={q:'',pick:null}; return pageSearch(); }
  if(h.startsWith('#/reports')){ RP={mode:'home'}; return pageReports(); }
  if(h.startsWith('#/access/teachers')) return pageTeacherAccess();
  if(h.startsWith('#/access')||h.startsWith('#/parents')){ PA={q:'',r:undefined}; return needP() && pageParents(false); }
  if(h.startsWith('#/data')) return pageData();
  return pageSetup();
}
window.addEventListener('hashchange',route);
boot();
